services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cardroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardroute}
      POSTGRES_USER: ${POSTGRES_USER:-cardroute_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardroute_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardroute_admin} -d ${POSTGRES_DB:-cardroute}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardroute-network

  redis:
    image: redis:7-alpine
    container_name: cardroute-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cardroute-network

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: cardroute-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - cardroute-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  cardroute-network:
    driver: bridge

